[project]
name = "get-your-knowledge-right"
version = "0.1.0"
description = "Personal knowledge/decision engine. v1: share a reel -> transcribe -> research -> dashboard."
requires-python = ">=3.11"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
