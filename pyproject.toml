[project]
name = "get-your-knowledge-right"
version = "0.1.0"
description = "Personal knowledge/decision engine. v1: share a reel -> transcribe -> research -> dashboard."
requires-python = ">=3.11"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# main.py must call load_dotenv() before importing app.research (which reads env vars into
# module-level constants at import time) — that necessarily puts a statement before imports.
"app/main.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
