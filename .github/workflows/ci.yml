name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
      - name: Audit dependencies for known CVEs
        # Non-blocking on purpose: a CVE with no patched release yet shouldn't turn CI red and
        # train us to ignore it. It informs (check the logs); lint+tests stay the merge signal.
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit
